    <rect x="1222" y="438" width="72" height="68" rx="7" fill="#C65C42"/><rect x="1307" y="438" width="72" height="68" rx="7" fill="#D3C4A0"/><rect x="1392" y="438" width="92" height="68" rx="7" fill="#708C80"/>
    <path d="M1236 456H1280M1236 469H1270M1320 456H1366M1320 469H1358M1406 456H1468M1406 469H1454" stroke="#20231F" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </g>
  <text x="1510" y="620" text-anchor="end" fill="#777E72" font-family="Roboto,Arial,sans-serif" font-size="12">Illustrative project artwork · BottleNeck v1.0.0</text>
