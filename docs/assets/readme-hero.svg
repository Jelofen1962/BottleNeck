    <rect x="1204" y="230" width="298" height="142" rx="12" fill="#20251F" stroke="#41483F"/>
    <text x="1474" y="259" text-anchor="end" fill="#ECE8DD" font-family="Vazirmatn,Arial,sans-serif" font-size="15" font-weight="600">یادداشت مشترک</text>
    <rect x="1222" y="278" width="262" height="76" rx="8" fill="#2B3029"/>
    <path d="M1240 297H1464M1240 314H1421M1240 331H1444" stroke="#A7ADA0" stroke-width="4" stroke-linecap="round" opacity=".65"/>
