<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">BottleNeck team workspace</title>
  <desc id="desc">A dark editorial illustration of a self-hosted team workspace with tasks, a collaborative board, Markdown notes and team chat.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#343833" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1600" height="650" rx="28" fill="#171916"/>
  <rect width="1600" height="650" rx="28" fill="url(#grid)"/>
  <path d="M0 0H1600V10H0Z" fill="#C65C42"/>
  <g transform="translate(86 84)">
    <rect width="58" height="58" rx="16" fill="#C65C42"/>
    <path d="M29 11V21M22 21H36L41 43Q42 49 36 49H22Q16 49 17 43L22 21Z" fill="none" stroke="#FFF9F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="42" fill="#F6F2EA" font-family="Roboto,Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-.8">BottleNeck</text>
    <text x="2" y="126" fill="#D6D2C8" font-family="Roboto,Arial,sans-serif" font-size="24" font-weight="500">A self-hosted workspace for teams that build together.</text>
    <text x="2" y="171" fill="#A9ACA3" font-family="Vazirmatn,Arial,sans-serif" font-size="19">کارها، یادداشت‌ها و گفت‌وگوها در یک فضای مشترک</text>
    <rect x="2" y="222" width="128" height="4" rx="2" fill="#C65C42"/>
    <text x="2" y="274" fill="#F6F2EA" font-family="Roboto,Arial,sans-serif" font-size="18">Tasks · Projects · Notes · Boards · Chat · Files</text>
    <text x="2" y="312" fill="#A9ACA3" font-family="Roboto,Arial,sans-serif" font-size="16">Persian-first  /  RTL  /  Self-hosted  /  LAN-ready</text>
    <g transform="translate(0 390)">
      <rect width="172" height="48" rx="8" fill="#F3EFE6"/>
      <text x="86" y="30" fill="#20231F" font-family="Roboto,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Open source workspace</text>
    </g>
  </g>
  <g filter="url(#shadow)">
