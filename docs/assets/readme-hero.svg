      <rect x="918" y="341" width="252" height="52" rx="8" fill="#2A3029"/><circle cx="1148" cy="367" r="5" fill="#6B9A83"/><text x="1132" y="371" text-anchor="end">آماده‌سازی گزارش تیم</text>
      <rect x="918" y="403" width="252" height="52" rx="8" fill="#2A3029"/><circle cx="1148" cy="429" r="5" fill="#C79D5A"/><text x="1132" y="433" text-anchor="end">بررسی فایل‌های پروژه</text>
