name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --group dev --python 3.12

      - name: Compile Python sources
        run: python -m py_compile main.py bottleneck_cli.py

      - name: Check browser JavaScript syntax
        run: node --check static/app.js

      - name: Run tests
        run: uv run --python 3.12 pytest -q
